default_stages: [pre-commit]
repos:
  - repo: local
    hooks:
      - id: format-lint
        name: Format and lint
        entry: bash -c 'git diff --cached --name-only --diff-filter=ACMR -z | xargs -0 -r npx prettier --ignore-unknown --write && npx eslint .'
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]
      - id: no-session-trailer
        name: Block leaked Claude-Session URLs in commit messages
        entry: bash scripts/check-commit-msg.sh
        language: system
        pass_filenames: true
        stages: [commit-msg]
      - id: build
        name: Check whether the build succeeds
        entry: npm run build
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
      - id: ci-local
        name: Emulate the GitHub deploy build (container, clean install)
        entry: bash scripts/ci-local.sh
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
