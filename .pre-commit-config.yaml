repos:
  - repo: local
    hooks:
      - id: format-lint
        name: Format and lint
        entry: bash -c 'npx prettier --write . && npx eslint .'
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]
      - id: build
        name: Check whether the build succeeds
        entry: npm run build
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
      - id: ci-local
        name: Emulate the GitHub deploy build (container, clean install)
        entry: bash scripts/ci-local.sh
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
