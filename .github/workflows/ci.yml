name: ci

on:
  pull_request:
    branches:
      - main
  workflow_dispatch: {}
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 25
          cache: npm

      - name: Upgrade npm
        run: npm install -g "npm@>=12.0.0-pre.0.0"

      - name: Install dependencies
        run: npm ci

      - name: typecheck
        run: npm run typecheck

      - name: lint
        run: npm run lint

      - name: build
        run: npm run build

      - name: test
        run: npm run test
