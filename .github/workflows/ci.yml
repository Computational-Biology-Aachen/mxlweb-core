name: ci

on:
  pull_request:
    branches:
      - main
  workflow_dispatch: {}
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.15
          cache: npm

      - name: Upgrade npm
        run: npm install -g "npm@==12.2.0"

      - name: Install dependencies
        run: npm ci

      - name: typecheck
        run: npm run typecheck

      - name: lint (non-blocking)
        continue-on-error: true
        run: npm run lint || { echo "::warning title=ESLint::lint errors found (non-blocking, see step log)"; exit 1; }

      - name: build
        run: npm run build

      - name: test
        run: npm run test
